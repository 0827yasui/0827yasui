name: Generate Breakout

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate Breakout SVG
        uses: cyprieng/github-breakout@v1
        with:
          github_user_name: ${{ github.repository_owner }}
          svg_out_path: dist/github-breakout.svg
          svg_dark_out_path: dist/github-breakout-dark.svg

      - name: Push Breakout SVG to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
