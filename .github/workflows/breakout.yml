name: Generate Breakout

on:
  schedule:
    # 毎日自動で更新する設定
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Breakout SVG
        uses: charles-m-k/github-contribution-breakout@v1
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/breakout.svg
            dist/breakout-dark.svg?palette=github-dark

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
